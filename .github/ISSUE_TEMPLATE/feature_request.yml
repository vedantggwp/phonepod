name: Feature Request
description: Suggest a focused improvement for phonepod
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What audio workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should phonepod do differently?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - cli
        - engine
        - mastering
        - web ui
        - packaging
        - docs
        - tests
        - other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: I have not included private recordings, credentials, or proprietary audio.
          required: true
